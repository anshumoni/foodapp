<app-search></app-search>
<app-tags></app-tags>
<app-not-found  [visible]="!islist" notfoundmessage="No Result Found" resetMessgae="Reset Search"></app-not-found>
<ul>
  <li *ngIf="!foodlists && !foodlists['length']">

  </li>
  @for(item of foodlists();track $index){
    <li>
    <a routerLink="/food/{{item.id}}">
      <img [src]="item.imageUrl" [alt]="item.name"/>
      <div class="name">
       {{item.name}}
      </div>
      <span class="favorite {{item.favorite?'':'not'}}"></span>
      <div class="stars">
      </div>
      <div class="product-item-origin">
        <div class="origin">
            <span *ngFor="let origin of item.origins">
                {{origin}}
            </span>
        </div>
      </div>
      <div class="cook-time">
         <span>Time</span> {{item.cookTime}}
      </div>
      <div class="price">
        <span>Price:{{item.price | currency}}</span>
      </div>
    </a>
    </li>
  }
</ul>
