<table>
    <tr>
        <td colspan="4">Order Items</td>
    </tr>
    <tr *ngFor="let item of orders.items">
        <td>
            <a routerLink="/food:item.food.id">
            <img [src]="item.food.imageUrl"/>
        </a>
      </td>
      <td>
        {{item.food.name}}
      </td>
      <td>
        {{item.food.price | currency}}
      </td>
      <td>
        {{item.quantity}}
      </td>
      <td>
        {{item.price| currency}}
      </td>
    </tr>
    <tr>
        <td colspan="3"></td>
        <td><strong>Total:</strong></td>
        <td><strong>Total Price:</strong></td>
    </tr>
</table>
